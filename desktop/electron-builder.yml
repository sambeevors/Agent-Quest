appId: com.pokeagent.desktop
productName: PokéAgent
directories:
  output: release
  buildResources: build-resources
files:
  - dist/main.js
  - package.json
extraResources:
  - from: build/pokeagent-server
    to: server/pokeagent-server
  - from: ../client/dist
    to: client
mac:
  category: public.app-category.developer-tools
  target: dir
  # Built and run on this machine only, so no Developer ID: electron-builder
  # ad-hoc signs ("-"), which is all Apple Silicon needs to launch it.
  identity: "-"
  icon: build-resources/icon.png
  # Hardened runtime only matters for notarization, and would need JIT
  # entitlements for the compiled Bun server; ad-hoc builds skip it.
  hardenedRuntime: false
